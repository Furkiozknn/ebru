<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ebru</title>
<meta name="description" content="A 3D paper-marbling art puzzle: sprinkle, comb and shape paint on the water, then lay the paper. Claude Game Arena, built by Claude Fable 5.1.">
<style>
:root{
  --bg:#1a140e; --ink:#f3ead8; --ink2:#c9b89a; --accent:#1E6FB8; --accent2:#2f86d4; --gold:#d9a441; --green:#5f9a58; --red:#b5452c;
  --glass:rgba(38,27,18,.66); --line:rgba(243,234,216,.14);
  --sa-t:env(safe-area-inset-top,0px); --sa-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent;
  touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);
  border-radius:16px;box-shadow:0 10px 32px rgba(0,0,0,.4)}
.serif{font-family:Georgia,"Times New Roman",serif}
svg{display:block}
i[data-icon]{display:inline-flex;width:24px;height:24px}
i[data-icon] svg{width:100%;height:100%}

/* top bar */
.topbar{position:fixed;top:calc(8px + var(--sa-t));left:8px;right:8px;min-height:56px;display:flex;align-items:center;gap:8px;padding:4px 8px;z-index:20}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--gold);white-space:nowrap}
.brand svg{width:30px;height:30px}
.brand span{font-size:19px;letter-spacing:.04em}
.stats{flex:1;display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--ink2);min-width:0}
.stats b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.stats .lsn{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mwrap{display:flex;align-items:center;gap:6px}
.mbar{display:inline-block;width:76px;height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;position:relative}
.mbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .25s}
.mbar em{position:absolute;left:80%;top:-2px;bottom:-2px;width:2px;background:#fff8}
.mwrap.ok b{color:var(--gold)}
.acts{display:flex;gap:2px}
.ibtn{width:44px;height:44px;border-radius:12px;border:1px solid transparent;background:transparent;display:inline-flex;align-items:center;
  justify-content:center;color:var(--ink);font-weight:700;font-size:13px;position:relative;padding:0}
.ibtn:hover{background:rgba(255,255,255,.08);border-color:var(--line)}
.ibtn.on{background:rgba(30,111,184,.4);border-color:rgba(217,164,65,.5)}
.ibtn:disabled{opacity:.35;cursor:default}
.ibtn i[data-icon]{width:24px;height:24px}
.ibtn.pulse{animation:pulse 1s ease-in-out infinite;border-color:var(--gold)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(217,164,65,.0)}50%{box-shadow:0 0 0 5px rgba(217,164,65,.45)}}
.stars{display:inline-flex;gap:2px;vertical-align:middle}
.stars svg{width:18px;height:18px}
.stars svg,.bigstars svg{fill:transparent;stroke:rgba(255,255,255,.4);stroke-width:1.5}
.stars svg.on,.bigstars svg.on{fill:var(--gold);stroke:var(--gold)}
@media (max-width:760px){
  .topbar{flex-wrap:wrap;padding:4px 6px}
  .brand span{display:none}
  .stats{gap:10px;font-size:13px;order:3;flex-basis:100%;justify-content:space-around;padding-bottom:4px}
  .stats .lsn{display:none}
  .acts{margin-left:auto}
  .mbar{width:48px}
}

/* target preview */
.preview{position:fixed;right:10px;top:calc(76px + var(--sa-t));width:min(28vw,220px);padding:6px;z-index:17;pointer-events:none}
.preview span{display:block;font-size:11px;color:var(--ink2);margin:0 0 4px 2px}
.preview canvas{display:block;width:100%;height:auto;border-radius:8px}
@media (max-width:760px){.preview{top:calc(112px + var(--sa-t));width:30vw}}

/* tool tray */
.tray{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + var(--sa-b));display:flex;align-items:center;gap:8px;padding:6px 8px;z-index:20;
  max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center}
.tray .grp{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:center}
.tray .sep{width:1px;align-self:stretch;background:var(--line)}
.tbtn{min-width:52px;height:56px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);padding:2px 4px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;position:relative}
.tbtn i[data-icon]{width:30px;height:30px}
.tbtn small{position:absolute;top:2px;left:5px;font-size:10px;color:var(--ink2)}
.tbtn.sel{border-color:var(--gold);background:rgba(217,164,65,.18);box-shadow:0 0 0 1px var(--gold) inset}
.tbtn:disabled{opacity:.3;cursor:default}
.tbtn.pulse{animation:pulse 1s ease-in-out infinite;border-color:var(--gold)}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.18);padding:0;position:relative;box-shadow:inset 0 -4px 8px rgba(0,0,0,.25)}
.sw.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),inset 0 -4px 8px rgba(0,0,0,.25)}
.sw.pulse{animation:pulse 1s ease-in-out infinite}
.sw:disabled{opacity:.25;cursor:default}
.cbtn{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.07);display:inline-flex;align-items:center;justify-content:center;padding:0}
.cbtn:hover{background:rgba(255,255,255,.14)}
.cbtn i[data-icon]{width:22px;height:22px}
.cbtn:disabled{opacity:.3;cursor:default}
.lay{min-height:56px;padding:0 16px;border-radius:12px;border:1px solid rgba(217,164,65,.45);background:var(--accent);color:#fff;font-weight:700;
  display:inline-flex;align-items:center;gap:8px;font-size:15px}
.lay:hover{background:var(--accent2)}
.lay i[data-icon]{width:22px;height:22px}
@media (max-width:760px){.tbtn{min-width:46px;height:50px}.tbtn i[data-icon]{width:26px;height:26px}.sw{width:40px;height:40px}.lay{min-height:50px;padding:0 12px;font-size:14px}.lay span{display:none}}

/* toasts */
.toasts{position:fixed;top:calc(76px + var(--sa-t));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;
  align-items:center;z-index:25;pointer-events:none;width:max-content;max-width:92vw}
@media (max-width:760px){.toasts{top:calc(120px + var(--sa-t))}}
.toast{padding:8px 16px;border-radius:12px;font-weight:600;font-size:14.5px;animation:tin .25s ease-out;border-left:4px solid var(--gold)}
.toast.good{border-left-color:var(--green)} .toast.bad{border-left-color:var(--red)}
.toast.out{opacity:0;transform:translateY(-6px);transition:all .3s}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* overlays */
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(14,10,6,.5);
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);z-index:30;padding:12px;overflow:auto}
.overlay.clear{background:rgba(14,10,6,.2);backdrop-filter:none;-webkit-backdrop-filter:none}
.panel{padding:22px 24px;width:min(94vw,470px);max-height:calc(100vh - 24px);overflow:auto}
.panel.wide{width:min(96vw,780px)}
.panel h2{margin:0 0 12px;font-size:24px;color:var(--gold)}
.col{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);
  font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:rgba(255,255,255,.14)}
.btn.primary{background:var(--accent);border-color:rgba(217,164,65,.45);color:#fff}
.btn.primary:hover{background:var(--accent2)}
.btn:disabled{opacity:.45;cursor:default}
.btn.w{width:100%}
.btn i[data-icon]{width:20px;height:20px}
label.sl{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink2)}
label.sl span{width:96px}
input[type=range]{flex:1;accent-color:var(--accent);height:44px;margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{min-height:44px;min-width:64px;padding:0 14px;border:0;background:transparent;font-weight:600}
.seg button.on{background:var(--accent);color:#fff}
.lbl{width:96px;font-size:14px;color:var(--ink2)}
.footer{margin-top:14px;font-size:12px;color:var(--ink2);text-align:center}
.footer a{color:var(--gold);text-decoration:none}
.footer a:hover{text-decoration:underline}

/* title */
.title{text-align:center;width:min(94vw,520px)}
.title .logo{width:120px;height:120px;margin:0 auto 2px}
.title .logo svg{width:100%;height:100%}
.title h1{margin:0;font-size:54px;color:var(--gold);letter-spacing:.06em;line-height:1.05}
.title .sub{margin:4px 0 10px;color:var(--ink);font-size:15px}
.title .how{font-size:13px;color:var(--ink2);margin:0 0 12px;line-height:1.45}
.title .best{font-size:14px;margin:12px 0 0;color:var(--ink)}
#loadmsg{color:var(--ink2);font-size:14px;margin:6px 0}

/* chapter map */
.chcards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:720px){.chcards{grid-template-columns:1fr}}
.chc{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:rgba(255,255,255,.04)}
.chc h3{margin:0;font-size:16px;color:var(--gold)}
.chc p{margin:2px 0 8px;font-size:12px;color:var(--ink2);line-height:1.35;min-height:32px}
.chc.locked{opacity:.5}
.lsn6{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lsn6 button{min-height:62px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-weight:700;font-size:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 2px;line-height:1.1}
.lsn6 button .stars svg{width:10px;height:10px}
.lsn6 button:disabled{opacity:.4;cursor:default}
.lsn6 button.done{border-color:var(--green)}
.lsn6 button.next{border-color:var(--gold);background:rgba(217,164,65,.15)}
.lsn6 button small{font-size:10px;color:var(--ink2);font-weight:400}

/* lesson intro, result */
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
@media (max-width:640px){.two{grid-template-columns:1fr}}
.sheetimg{width:100%;aspect-ratio:4/3;border-radius:10px;background:#e9e2cf;display:block;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.cap{font-size:12px;color:var(--ink2);margin:4px 0 0;text-align:center}
.note{background:rgba(255,255,255,.06);border-left:3px solid var(--gold);padding:8px 12px;border-radius:0 10px 10px 0;font-size:14px;line-height:1.4}
.note b{color:var(--gold)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.07)}
.chip i[data-icon]{width:16px;height:16px}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid rgba(255,255,255,.3)}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rhead h2{margin:0;font-size:22px}
.bigstars{display:flex;gap:6px}
.bigstars svg{width:30px;height:30px}
.kv{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
.kv div{padding:10px;border-radius:12px;background:rgba(255,255,255,.06);text-align:center}
.kv b{display:block;font-size:22px;color:var(--gold)}
.kv span{font-size:12px;color:var(--ink2)}
.rec{color:var(--green);font-weight:700;text-align:center;margin:4px 0}
.galgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:640px){.galgrid{grid-template-columns:repeat(3,1fr)}}
.galgrid figure{margin:0;position:relative}
.galgrid img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block;background:#e9e2cf}
.galgrid button{position:absolute;right:4px;top:4px;width:30px;height:30px;border-radius:8px;border:0;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.galgrid button i[data-icon]{width:16px;height:16px}
.empty{color:var(--ink2);font-size:14px;text-align:center;padding:20px 0}

/* v2: coach card (the master's note, in play), live critique, rim glow, seals, thickness, book covers, mascot */
.coach{position:fixed;left:10px;top:calc(76px + var(--sa-t));width:min(36vw,340px);padding:12px 14px;z-index:18;transition:opacity .45s,transform .45s}
.coach.out{opacity:0;transform:translateY(-8px);pointer-events:none}
.coach h3{margin:0 0 6px;font-size:17px;color:var(--gold)}
.coach .note{font-size:13px;margin-bottom:8px}
.coach .chips{margin-bottom:8px}
.coach .tip{font-size:12px;color:var(--ink2);margin:0 0 8px;line-height:1.35}
.coach .btn{min-height:44px;font-size:14px;padding:0 14px}
@media (max-width:760px){.coach{left:8px;right:calc(30vw + 18px);width:auto;top:calc(120px + var(--sa-t));max-height:40vh;overflow:auto;padding:10px 12px}.coach .chips{display:none}}
.crit{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--sa-b));padding:6px 14px;border-radius:999px;font-size:13.5px;font-weight:600;
  z-index:19;pointer-events:none;max-width:92vw;text-align:center;border-left:4px solid var(--red);transition:opacity .3s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crit.good{border-left-color:var(--green)}
.crit[hidden]{display:none}
@media (max-width:760px){.crit{bottom:calc(118px + var(--sa-b));font-size:12.5px}}
.rim{position:fixed;inset:0;pointer-events:none;z-index:15;opacity:0;box-shadow:inset 0 0 90px 10px rgba(217,164,65,.55);transition:opacity .35s}
.rim.on{opacity:1}
.seal{display:inline-flex;width:22px;height:22px;vertical-align:middle}
.seal svg{width:100%;height:100%}
.lsn6 button .seal{position:absolute;right:3px;top:3px;width:16px;height:16px}
.lsn6 button{position:relative}
.rankline{font-size:14px;margin:8px 0 0;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px}
.fact{font-size:12.5px;color:var(--ink2);line-height:1.4;margin:10px 0 0;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.05)}
.fact b{color:var(--gold)}
.tray .seg button{min-width:48px;min-height:46px;padding:0 10px;font-size:13px;background:rgba(255,255,255,.06);color:var(--ink)}
.tray .seg button.on{background:var(--accent);color:#fff}
.tray .seg{align-self:center}
#result .two{max-width:620px;margin:0 auto}
#result .kv{margin:8px 0}
.sealchip{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);padding:6px 10px;border-radius:999px;background:rgba(181,69,44,.18);border:1px solid rgba(181,69,44,.5)}
.sealchip.off{opacity:.65;background:rgba(255,255,255,.05);border-color:var(--line)}
.rhead img.cat{width:72px;height:72px;object-fit:contain;margin-left:auto}
.galgrid button.bind{right:auto;left:4px;background:rgba(181,69,44,.75)}
.galgrid button.bind.on{background:var(--red)}
.title .logo.cat{width:96px;height:96px}
#dbg{position:fixed;left:8px;bottom:calc(8px + var(--sa-b));font:12px/1.4 ui-monospace,Consolas,monospace;color:#9f9;background:rgba(0,0,0,.65);
  padding:6px 8px;white-space:pre;pointer-events:none;z-index:60;border-radius:6px;max-width:92vw;overflow:hidden}
#dbg .err{color:#f66}
</style>
<script type="importmap">

</script>

<body>
<canvas id="c" tabindex="0" aria-label="Ebru tray"></canvas>

<!-- HUD -->
<div id="hud" class="topbar glass" hidden>
  <div class="brand"><span class="logo-s"></span><span>Ebru</span></div>
  <div class="stats">
    <span class="lsn" id="hLesson"></span>
    <span class="mwrap" id="hMatchWrap"><span data-t="match"></span> <b id="hMatch">0%</b><span class="mbar"><i id="hMatchBar"></i><em></em></span></span>
    <span><span data-t="strokes"></span> <b id="hStrokes">0</b></span>
    <span class="stars" id="hStars"></span>
  </div>
  <div class="acts">
    <button class="ibtn" id="bMap" data-tt="lessons"><i data-icon="map"></i></button>
    <button class="ibtn" id="bHint" data-tt="hint"><i data-icon="hint"></i></button>
    <button class="ibtn" id="bUndo" data-tt="undo"><i data-icon="undo"></i></button>
    <button class="ibtn" id="bReset" data-tt="reset"><i data-icon="reset"></i></button>
    <button class="ibtn" id="bPause" data-tt="pause"><i data-icon="pause"></i></button>
    <button class="ibtn" id="bSound" data-tt="sound"><i data-icon="sound"></i></button>
    <button class="ibtn" id="bLang" data-tt="language">TR</button>
  </div>
</div>
<div id="preview" class="preview glass" hidden><span data-t="target"></span><canvas id="tgtPrev" width="200" height="150"></canvas></div>
<div id="tools" class="tray glass" hidden>
  <div class="grp" id="toolGrp">
    <button class="tbtn" data-tool="brush"><small>1</small><i data-icon="brush"></i></button>
    <button class="tbtn" data-tool="biz"><small>2</small><i data-icon="awl"></i></button>
    <button class="tbtn" data-tool="tarak"><small>3</small><i data-icon="comb"></i></button>
    <button class="tbtn" data-tool="big"><small>4</small><i data-icon="drop"></i></button>
  </div>
  <div class="sep"></div>
  <div class="grp" id="swatches"></div>
  <div class="sep"></div>
  <div class="grp">
    <div class="seg" id="segThick" hidden><button data-v="0" data-t="thin"></button><button data-v="1" data-t="medium"></button><button data-v="2" data-t="thick"></button></div>
    <button class="lay" id="bLay"><i data-icon="paper"></i><span data-t="lay"></span></button>
    <button class="cbtn" id="bBindFree" data-tt="bind" hidden><i data-icon="bind"></i></button>
    <button class="cbtn" id="bGallery" data-tt="gallery" hidden><i data-icon="gallery"></i></button>
  </div>
</div>
<div id="toasts" class="toasts"></div>
<div id="rim" class="rim"></div>
<div id="crit" class="crit glass" hidden></div>
<!-- the master's note, shown over the tray at the start of a lesson and faded at the first stroke -->
<div id="coach" class="coach glass" hidden>
  <h3 class="serif" id="coTitle"></h3>
  <div class="note" id="coNote"></div>
  <div class="chips" id="coChips"></div>
  <p class="tip" id="coTip"></p>
  <button class="btn" id="bCoachOk"><span data-t="gotIt"></span></button>
</div>

<!-- Title -->
<div id="title" class="overlay">
  <div class="panel glass title">
    <div class="logo" id="logoBig"></div>
    <h1 class="serif">Ebru</h1>
    <p class="sub" data-t="subtitle"></p>
    <p class="how" data-t="howto"></p>
    <div id="loadmsg">Yükleniyor…</div>
    <div class="col">
      <button class="btn primary w" id="bPlay" disabled><i data-icon="play"></i><span data-t="play"></span> <small id="contInfo"></small></button>
      <div class="row" style="justify-content:center">
        <button class="btn" id="bLessons" hidden><i data-icon="map"></i><span data-t="lessons"></span></button>
        <button class="btn" id="bFree"><i data-icon="brush"></i><span data-t="free"></span></button>
        <button class="btn" id="bGal2"><i data-icon="gallery"></i><span data-t="gallery"></span></button>
        <button class="btn" id="bSettings"><i data-icon="gear"></i><span data-t="settings"></span></button>
        <button class="btn" id="bLang2">EN</button>
      </div>
    </div>
    <p class="best" id="bestLine"></p>
    <p class="rankline" id="rankLine"></p>
    <p class="fact" id="factLine"></p>
    <p class="footer">Claude Game Arena · <a href="https://furkiozknn.github.io/" target="_blank" rel="noopener">built by Claude Fable 5.1</a></p>
  </div>
</div>

<!-- Chapter map -->
<div id="map" class="overlay" hidden>
  <div class="panel glass wide">
    <div class="rhead"><h2 class="serif" data-t="lessons"></h2><span class="stars" id="mapStars"></span></div>
    <div class="chcards" id="chcards"></div>
    <div class="row end" style="margin-top:12px">
      <button class="btn" id="bMapFree"><i data-icon="brush"></i><span data-t="free"></span></button>
      <button class="btn" id="bMapBack"><span data-t="mainMenu"></span></button>
    </div>
  </div>
</div>

<!-- Pause -->
<div id="pause" class="overlay" hidden>
  <div class="panel glass col">
    <h2 class="serif" data-t="paused"></h2>
    <button class="btn primary w" id="bResume"><span data-t="resume"></span></button>
    <button class="btn w" id="bRestart"><span data-t="restart"></span></button>
    <button class="btn w" id="bPMap"><span data-t="lessons"></span></button>
    <button class="btn w" id="bPSettings"><span data-t="settings"></span></button>
    <button class="btn w" id="bPMenu"><span data-t="mainMenu"></span></button>
  </div>
</div>

<!-- Settings -->
<div id="settings" class="overlay" hidden>
  <div class="panel glass col">
    <h2 class="serif" data-t="settings"></h2>
    <label class="sl"><span data-t="master"></span><input type="range" id="sMaster" min="0" max="1" step="0.05"></label>
    <label class="sl"><span data-t="music"></span><input type="range" id="sMusic" min="0" max="1" step="0.05"></label>
    <label class="sl"><span data-t="effects"></span><input type="range" id="sSfx" min="0" max="1" step="0.05"></label>
    <div class="row"><span class="lbl" data-t="language"></span><div class="seg" id="segLang"><button data-v="tr">Türkçe</button><button data-v="en">English</button></div></div>
    <div class="row"><span class="lbl" data-t="quality"></span><div class="seg" id="segQ"><button data-v="low" data-t="low"></button><button data-v="high" data-t="high"></button></div></div>
    <div class="row"><span class="lbl" data-t="fullscreen"></span><button class="btn" id="bFull"><i data-icon="full"></i><span data-t="fullscreen"></span></button></div>
    <button class="btn primary w" id="bSetBack" style="margin-top:6px"><span data-t="back"></span></button>
  </div>
</div>

<!-- Result -->
<div id="result" class="overlay" hidden>
  <div class="panel glass wide">
    <div class="rhead"><h2 class="serif" id="rTitle"></h2><div class="bigstars" id="rStars"></div><img class="cat" id="rCat" alt="" hidden></div>
    <p class="rec" id="rRec" hidden></p>
    <div class="two">
      <div><canvas class="sheetimg" id="rSheet" width="400" height="300"></canvas><p class="cap" id="rSheetCap"></p></div>
      <div id="rTargetWrap"><canvas class="sheetimg" id="rTarget" width="400" height="300"></canvas><p class="cap" data-t="target"></p></div>
    </div>
    <div class="kv" id="rKv"></div>
    <div class="note" id="rCrit" hidden></div>
    <div class="row" id="rSealRow" style="margin:8px 0"></div>
    <p class="fact" id="rFact"></p>
    <div class="row end">
      <button class="btn" id="bBind"><i data-icon="bind"></i><span data-t="bind"></span></button>
      <button class="btn" id="bRMap"><span data-t="lessons"></span></button>
      <button class="btn" id="bRetry"><i data-icon="reset"></i><span data-t="retry"></span></button>
      <button class="btn primary" id="bNext"><i data-icon="play"></i><span data-t="next"></span></button>
    </div>
  </div>
</div>

<!-- Gallery -->
<div id="gallery" class="overlay" hidden>
  <div class="panel glass wide">
    <div class="rhead"><h2 class="serif" data-t="gallery"></h2><span id="galCount" style="color:var(--ink2);font-size:13px"></span></div>
    <div class="galgrid" id="galGrid"></div>
    <p class="empty" id="galEmpty" data-t="galEmpty"></p>
    <div class="row end" style="margin-top:12px"><button class="btn primary" id="bGalBack"><span data-t="back"></span></button></div>
  </div>
</div>

<!-- Ending -->
<div id="ending" class="overlay" hidden>
  <div class="panel glass title">
    <div class="logo" id="logoEnd"></div>
    <h2 class="serif" data-t="endTitle" style="font-size:30px"></h2>
    <p class="sub" data-t="endSub"></p>
    <p class="rankline" id="eRank"></p>
    <div class="kv" id="eKv"></div>
    <div class="col">
      <button class="btn primary w" id="bEFree"><i data-icon="brush"></i><span data-t="free"></span></button>
      <button class="btn w" id="bEMenu"><span data-t="mainMenu"></span></button>
    </div>
  </div>
</div>

<div id="dbg" hidden></div>

<script>
// Error capture + loading state (classic script so it runs before the module resolves)
window.__errs = [];
window.addEventListener('error', e => { window.__errs.push(String(e.message || e)); });
window.addEventListener('unhandledrejection', e => { window.__errs.push('Promise: ' + String(e.reason && e.reason.message || e.reason)); });
// "Did you know?" facts, all from the UNESCO Representative List entry for ebru (shown while loading and on result cards).
// Sources: https://ich.unesco.org/en/RL/ebru-turkish-art-of-marbling-00644 (facts 1-4) and https://ich.unesco.org/en/decisions/9.COM/10.44 (fact 1)
window.EBRU_FACTS = [
  { tr: 'Ebru, 2014\'te UNESCO Somut Olmayan Kültürel Miras Temsili Listesi\'ne girdi.', en: 'Ebru, the Turkish art of marbling, was inscribed on UNESCO\'s Representative List in 2014.' },
  { tr: 'Pigmentler koyulaştırılmış suya serpilir ve fırçayla işlenir; desen kâğıda alınır.', en: 'Pigments are sprinkled on thickened water and worked with a brush; the pattern is taken up on paper.' },
  { tr: 'Ebru cilt ve kitap süslemede kullanılır.', en: 'Ebru is used to decorate book covers and bindings.' },
  { tr: 'Temel beceri için en az iki yıl gerekir; usta-çırak yoluyla aktarılır, yaş, cinsiyet ya da köken engeli yoktur.', en: 'The basic skill takes at least two years, passed from master to apprentice, with no barrier of age, gender or origin.' },
];
(function () {
  const q = new URLSearchParams(location.search).get('lang');
  const tr = q ? q === 'tr' : !/^en/i.test(navigator.language || '');
  document.getElementById('loadmsg').textContent = tr ? 'Yükleniyor… 0/18' : 'Loading… 0/18';
  const f = window.EBRU_FACTS[Math.floor(Date.now() / 60000) % window.EBRU_FACTS.length];
  document.getElementById('factLine').innerHTML = '<b>' + (tr ? 'Biliyor muydun?' : 'Did you know?') + '</b> ' + (tr ? f.tr : f.en);
  setTimeout(() => { if (!window.__loaded) document.getElementById('loadmsg').textContent = tr ? 'Three.js yüklenemedi; internet bağlantısını kontrol et.' : 'Three.js could not load; check your connection.'; }, 20000);
})();
</script>

// Execute one recorded stroke on a sim. Strokes: {k:'brush'|'big', c, p:[[x,y]...]} or {k:'biz'|'tarak', p:[[x,y]...]}.
// The same code runs for the player's drag (incrementally), the bot and the target generator.
class StrokeRunner {
  constructor(sim, tools = TOOL) { this.sim = sim; this.s = null; this.T = tools; }
  begin(stroke, x, y) {
    const k = stroke.k; this.s = { k, c: stroke.c, lx: x, ly: y, ax: x, ay: y, x0: x, y0: y, acc: 0, n: 0 };
    if (k === 'brush' || k === 'big') {
      const T = this.T[k]; this.s.rng = mulberry(hashSeed(x, y, k === 'big' ? 7 : 3));
      const r = T.r * (k === 'big' ? 1 : 0.85 + 0.3 * this.s.rng());
      this.sim.drop(x, y, r, stroke.c); this.s.n++; return [{ x, y, r }];
    }

  }
  move(x, y) {
    const s = this.s; if (!s) return []; const ev = [];
    if (s.k === 'brush' || s.k === 'big') {
      const T = this.T[s.k]; const dx = x - s.lx, dy = y - s.ly, d = Math.hypot(dx, dy); if (d < 1e-6) return ev;
      let travelled = 0;
      while (s.acc + (d - travelled) >= T.spread) { // drops fall every `spread` units along the path
        travelled += T.spread - s.acc; s.acc = 0;
        const jx = T.jitter ? (s.rng() - 0.5) * 2 * T.jitter : 0, jy = T.jitter ? (s.rng() - 0.5) * 2 * T.jitter : 0;
        const r = T.r * (s.k === 'big' ? 1 : 0.75 + 0.5 * s.rng());
        const px = clampS(s.lx + dx / d * travelled + jx, 4, SW - 4), py = clampS(s.ly + dy / d * travelled + jy, 4, SH - 4);
        this.sim.drop(px, py, r, s.c); s.n++; ev.push({ x: px, y: py, r });
      }
      s.acc += d - travelled; s.lx = x; s.ly = y; return ev;
    }
    // line tools: walk from the last applied anchor towards the pointer in fixed STEP increments,
    // so the result does not depend on the pointer event rate (player, bot and targets agree)
    const dx = x - s.ax, dy = y - s.ay, d = Math.hypot(dx, dy);
    if (d < STEP) return ev;
    const ux = dx / d, uy = dy / d, n = Math.floor(d / STEP);
    for (let i = 0; i < n; i++) {
      const bx = s.ax + ux * STEP, by = s.ay + uy * STEP;
      if (s.k === 'biz') this.sim.tine(s.ax, s.ay, bx, by, this.T.biz);

        let tx = s.ax - s.x0, ty = s.ay - s.y0; const tl = Math.hypot(tx, ty);
        if (tl > 40) { tx /= tl; ty /= tl; } else { tx = ux; ty = uy; }
        this.sim.comb(s.ax, s.ay, bx, by, this.T.tarak, tx, ty);
      }
      s.ax = bx; s.ay = by; s.n++;
    }
    return ev;
  }
  end() { const s = this.s; this.s = null; return s; }
}

function runStroke(sim, stroke) {
  const R = new StrokeRunner(sim); const p = stroke.p;
  R.begin(stroke, p[0][0], p[0][1]);
  for (let i = 1; i < p.length; i++) R.move(p[i][0], p[i][1]);
  R.end();
}

  const p = [];

    const y = rows === 1 ? y0 : y0 + (y1 - y0) * i / (rows - 1); const L = (i % 2 === 0) === startLeft;
    const n = 6; for (let k = 0; k <= n; k++) { const f = k / n; p.push([(L ? x0 : x1) + ((L ? x1 : x0) - (L ? x0 : x1)) * f, clampS(y + (recipeRng() - 0.5) * 70, 30, SH - 30)]); }
  }

  for (const b of $('segLang').children) b.classList.toggle('on', b.dataset.v === SET.lang);
  for (const b of $('segQ').children) b.classList.toggle('on', b.dataset.v === SET.quality);
  showOverlay('settings');
}
function closeSettings() { saveSettings(); showOverlay(G.settingsFrom === 'pause' ? 'pause' : 'title'); if (G.settingsFrom === 'title') refreshTitle(); }
function openGallery(from) {
  G.galleryFrom = from; const grid = $('galGrid'); grid.innerHTML = '';
  $('galEmpty').hidden = GALLERY.length > 0; $('galCount').textContent = t('galCount', { n: GALLERY.length });
  GALLERY.slice().reverse().forEach((src, ri) => {
    const idx = GALLERY.length - 1 - ri; const f = document.createElement('figure');
    const img = document.createElement('img'); img.alt = 'ebru'; f.appendChild(img);
    if (BOUND[idx]) { const im = new Image(); im.onload = () => { img.src = bindCover(im, 256, 192).toDataURL('image/jpeg', 0.85); }; im.src = src; } else img.src = src;
    const b = document.createElement('button'); b.innerHTML = ICON.close; b.title = t('delete'); b.setAttribute('aria-label', t('delete'));
    b.addEventListener('click', () => { GALLERY.splice(idx, 1); BOUND.splice(idx, 1); saveGallery(); sfxClick(); openGallery(from); }); f.appendChild(b);
    const bb = document.createElement('button'); bb.className = 'bind' + (BOUND[idx] ? ' on' : ''); bb.innerHTML = ICON.bind; bb.title = t(BOUND[idx] ? 'unbind' : 'bind'); bb.setAttribute('aria-label', bb.title);
    bb.addEventListener('click', () => { BOUND[idx] = BOUND[idx] ? 0 : 1; saveGallery(); sfxPaper(true); openGallery(from); }); f.appendChild(bb);
    grid.appendChild(f);
  });
  showOverlay('gallery');
}
function closeGallery() { if (G.galleryFrom === 'play') { showOverlay(null); } else showOverlay('title'); }
function showEnding() {
  G.state = 'ending'; hudVisible(false); const total = LESSONS.reduce((a, _, i) => a + (PROG.stars[i] || 0), 0);
  $('eKv').innerHTML = `<div><b>${total}/54</b><span>${t('starsLbl')}</span></div><div><b>18/18</b><span>${t('lessons')}</span></div><div><b>${sealCount()}/18</b><span>${t('seal')}</span></div>`;
  $('eRank').innerHTML = rankHtml();
  showOverlay('ending'); sfxChime(true);
}

// ---------------------------------------------------------------------------
// Toasts, texts, icons, settings
// ---------------------------------------------------------------------------
function toast(msg, kind = 'info') {
  const wrap = $('toasts'); const d = document.createElement('div'); d.className = 'toast glass ' + kind; d.textContent = msg; wrap.appendChild(d);
  while (wrap.children.length > 4) wrap.firstChild.remove();
  setTimeout(() => { d.classList.add('out'); setTimeout(() => d.remove(), 320); }, 2400);
}
function fillIcons(root = document) { for (const el of root.querySelectorAll('i[data-icon]')) if (!el.firstChild) el.innerHTML = ICON[el.dataset.icon] || ''; }
function applyTexts() {
  document.documentElement.lang = SET.lang;
  for (const el of document.querySelectorAll('[data-t]')) el.textContent = t(el.dataset.t);
  for (const el of document.querySelectorAll('[data-tt]')) { el.title = t(el.dataset.tt); el.setAttribute('aria-label', t(el.dataset.tt)); }
  $('bLang').textContent = SET.lang.toUpperCase(); $('bLang2').textContent = SET.lang === 'tr' ? 'English' : 'Türkçe';
  for (const b of document.querySelectorAll('#toolGrp .tbtn')) { b.title = t(b.dataset.tool); b.setAttribute('aria-label', t(b.dataset.tool)); }
  for (const b of document.querySelectorAll('#swatches .sw')) { b.title = PAL[+b.dataset.c][SET.lang]; }
  if (G.L && (G.state === 'play' || G.state === 'laying')) $('hLesson').textContent = `${G.L.index + 1}. ${G.L.name[SET.lang]}`;
  if (G.free && G.state === 'play') $('hLesson').textContent = t('freeTitle');
  if (G.state === 'map') buildMap(); if (G.state === 'title') refreshTitle(); if (G.coach) showCoach(false);
  if (G.state === 'play') updateHud();
  $('galEmpty').textContent = t('galEmpty');
  const f = window.EBRU_FACTS[Math.floor(Date.now() / 60000) % window.EBRU_FACTS.length]; $('factLine').innerHTML = `<b>${t('didYouKnow')}</b> ${f[SET.lang]}`;
  updateSoundIcon();
}
function setLang(l) { SET.lang = l; saveSettings(); applyTexts(); for (const b of $('segLang').children) b.classList.toggle('on', b.dataset.v === l); }
function updateSoundIcon() { const on = SET.musicOn || SET.sfxOn; $('bSound').innerHTML = on ? ICON.sound : ICON.mute; $('bSound').classList.toggle('on', false); }
function toggleMusic() { SET.musicOn = !SET.musicOn; applyVolumes(); saveSettings(); updateSoundIcon(); toast(t(SET.musicOn ? 'musicOn' : 'musicOff')); if (SET.musicOn && AUD.ctx) { AUD.nextBar = AUD.ctx.currentTime + 0.1; } }
function toggleSfx() { SET.sfxOn = !SET.sfxOn; applyVolumes(); saveSettings(); updateSoundIcon(); toast(t(SET.sfxOn ? 'sfxOn' : 'sfxOff')); }
function toggleSound() { const on = !(SET.musicOn || SET.sfxOn); SET.musicOn = on; SET.sfxOn = on; applyVolumes(); saveSettings(); updateSoundIcon(); toast(t(on ? 'soundOn' : 'soundOff')); if (on && AUD.ctx) AUD.nextBar = AUD.ctx.currentTime + 0.1; }
function setQuality(q) {
  SET.quality = q; saveSettings();
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, q === 'low' ? 1 : 1.5)); renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = q !== 'low'; sun.castShadow = q !== 'low'; scene.traverse(o => { if (o.material) o.material.needsUpdate = true; });
  const w = q === 'low' ? 512 : 768; if (paintRT.width !== w) { paintRT.setSize(w, w * 3 / 4); G.dirtyTex = true; }
  dustGeo.setDrawRange(0, q === 'low' ? Math.floor(DUST_N / 2) : DUST_N);
  for (const b of $('segQ').children) b.classList.toggle('on', b.dataset.v === q);
}
function toggleFullscreen() { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (e) { /* unsupported */ } }

// ---------------------------------------------------------------------------
// Input: pointer, wheel, pinch, keyboard
// ---------------------------------------------------------------------------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), hitV = new THREE.Vector3();
function toSim(cx, cy) {
  ndc.x = cx / innerWidth * 2 - 1; ndc.y = -(cy / innerHeight) * 2 + 1; ray.setFromCamera(ndc, camera);
  if (!ray.ray.intersectPlane(pickPlane, hitV)) return null;
  return { x: (hitV.x / TRAY_W + 0.5) * SW, y: (hitV.z / TRAY_H + 0.5) * SH, wx: hitV.x, wz: hitV.z };
}
const inTray = (p, m = 0) => p && p.x >= -m && p.x <= SW + m && p.y >= -m && p.y <= SH + m;
const pointers = new Map(); let strokePointer = null, pinch = null;
canvas.addEventListener('pointerdown', e => {
  bootAudio(); canvas.focus();
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) { if (G.stroke) endStroke(); strokePointer = null; const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: CAM.zoom }; return; }
  if (G.state !== 'play' || G.paused || G.stroke) return;
  const p = toSim(e.clientX, e.clientY); if (!inTray(p, 40)) return;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  strokePointer = e.pointerId; G.hover = p; startStroke(p.x, p.y);
});
canvas.addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pointers.size === 2) { const [a, b] = [...pointers.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); CAM.zoom = clampS(pinch.z * pinch.d / Math.max(1, d), 0.55, 1.4); fitCamera(); return; }
  const p = toSim(e.clientX, e.clientY);
  G.hover = inTray(p, 60) ? p : null;
  if (G.stroke && e.pointerId === strokePointer && p) moveStroke(p.x, p.y);
  else if (p && G.state === 'play') { const h = G.hover; if (h && G.lastHover) { const dx = h.x - G.lastHover.x, dy = h.y - G.lastHover.y, d = Math.hypot(dx, dy); if (d > 2) G.lastDir = [dx / d, dy / d]; } G.lastHover = h; redrawOverlay(); }
});
function pointerEnd(e) {
  pointers.delete(e.pointerId); if (pointers.size < 2) pinch = null;
  if (e.pointerId === strokePointer) { strokePointer = null; endStroke(); }
}
canvas.addEventListener('pointerup', pointerEnd); canvas.addEventListener('pointercancel', pointerEnd);
canvas.addEventListener('pointerleave', () => { if (!G.stroke) { G.hover = null; redrawOverlay(); } });
canvas.addEventListener('wheel', e => { e.preventDefault(); CAM.zoom = clampS(CAM.zoom * (1 + e.deltaY * 0.0012), 0.55, 1.4); fitCamera(); }, { passive: false });
addEventListener('keydown', e => {
  const tag = (e.target && e.target.tagName) || ''; if (tag === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === 'm') { toggleMusic(); return; } if (k === 'x') { toggleSfx(); return; } if (k === 'l') { setLang(SET.lang === 'tr' ? 'en' : 'tr'); return; }
  if (k === 'f' && G.state === 'play') { toggleFullscreen(); return; }
  if (k === 'p' || k === 'escape') {
    if (G.state === 'play') { togglePause(); e.preventDefault(); }
    else if (G.state === 'map' || G.state === 'gallery' && G.galleryFrom !== 'play') { if (k === 'escape') goTitle(); }
    return;
  }
  if (G.state !== 'play' || G.paused) return;
  if (k === '1') setTool('brush'); else if (k === '2') setTool('biz'); else if (k === '3') setTool('tarak'); else if (k === '4') setTool('big');
  else if (k === 'z') undo(); else if (k === 'r') resetTray(); else if (k === 'h') showHint();
  else if (k === 'enter' && !(e.target && e.target.tagName === 'BUTTON')) { layPaper(); e.preventDefault(); }
  else if (k === 'g' && G.free) openGallery('play');
  else if (k === 't' && G.free) setThick((G.thick + 1) % 3);
  else if (k === 'b' && G.free) bindLastFree();
});
document.addEventListener('visibilitychange', () => { G.hidden = document.hidden; if (document.hidden && G.stroke) endStroke(); });

// buttons
$('bPlay').addEventListener('click', () => { bootAudio(); sfxClick(); playNext(); });
$('bLessons').addEventListener('click', () => { bootAudio(); sfxClick(); openMap(); });
$('bMap').addEventListener('click', () => { sfxClick(); openMap(); });
$('bPMap').addEventListener('click', () => { sfxClick(); openMap(); });
$('bCoachOk').addEventListener('click', () => { sfxClick(); hideCoach(); canvas.focus(); });
$('bBind').addEventListener('click', () => { sfxClick(); bindResult(); });
$('bBindFree').addEventListener('click', () => { sfxClick(); bindLastFree(); });
for (const b of $('segThick').children) b.addEventListener('click', () => setThick(+b.dataset.v));
$('bFree').addEventListener('click', () => { bootAudio(); sfxClick(); beginFree(); });
$('bMapFree').addEventListener('click', () => { sfxClick(); beginFree(); });
$('bEFree').addEventListener('click', () => { sfxClick(); beginFree(); });
$('bGal2').addEventListener('click', () => { bootAudio(); sfxClick(); openGallery('title'); });
$('bGallery').addEventListener('click', () => { sfxClick(); openGallery('play'); });
$('bGalBack').addEventListener('click', () => { sfxClick(); closeGallery(); });
$('bSettings').addEventListener('click', () => { bootAudio(); sfxClick(); openSettings('title'); });
$('bPSettings').addEventListener('click', () => { sfxClick(); openSettings('pause'); });
$('bSetBack').addEventListener('click', () => { sfxClick(); closeSettings(); });
$('bLang2').addEventListener('click', () => { setLang(SET.lang === 'tr' ? 'en' : 'tr'); });
$('bLang').addEventListener('click', () => { setLang(SET.lang === 'tr' ? 'en' : 'tr'); });
$('bMapBack').addEventListener('click', () => { sfxClick(); goTitle(); });
$('bResume').addEventListener('click', () => togglePause(false));
$('bRestart').addEventListener('click', () => { sfxClick(); if (G.free) beginFree(); else beginPlay(); });
$('bPMenu').addEventListener('click', () => { sfxClick(); goTitle(); });
$('bEMenu').addEventListener('click', () => { sfxClick(); goTitle(); });
$('bRMap').addEventListener('click', () => { sfxClick(); openMap(); });
$('bRetry').addEventListener('click', () => { sfxClick(); beginPlay(); });
$('bNext').addEventListener('click', () => { sfxClick(); if (G.L.index === 17) { if (firstUnsolved() >= 18) showEnding(); else openMap(); } else startLesson(G.L.index + 1); });
$('bHint').addEventListener('click', showHint); $('bUndo').addEventListener('click', undo); $('bReset').addEventListener('click', resetTray);
$('bPause').addEventListener('click', () => togglePause()); $('bSound').addEventListener('click', toggleSound); $('bLay').addEventListener('click', layPaper);
for (const b of document.querySelectorAll('#toolGrp .tbtn')) b.addEventListener('click', () => setTool(b.dataset.tool));
$('sMaster').addEventListener('input', e => { SET.master = +e.target.value; applyVolumes(); });
$('sMusic').addEventListener('input', e => { SET.music = +e.target.value; applyVolumes(); });
$('sSfx').addEventListener('input', e => { SET.sfx = +e.target.value; applyVolumes(); });
$('sSfx').addEventListener('change', () => sfxDrip(30));
for (const b of $('segLang').children) b.addEventListener('click', () => setLang(b.dataset.v));
for (const b of $('segQ').children) b.addEventListener('click', () => { sfxClick(); setQuality(b.dataset.v); });
$('bFull').addEventListener('click', toggleFullscreen);
for (const o of OVERLAYS) $(o).addEventListener('pointerdown', () => bootAudio(), { once: true });

// ---------------------------------------------------------------------------
// Bot (?auto): plays every lesson by making the recipe strokes through the same stroke API as the player
// ---------------------------------------------------------------------------
const BOT = { on: FLAG.auto, wait: 0, pts: null, i: 0, budget: 0, retries: 0, done: false, lessonsDone: 0, log: [] };
const botRng = mulberry(12345);
function botPath(p) { // resample the recipe path to ~20-unit steps with a slow hand tremor
  const out = []; const J = FLAG.botJitter; let ox = 0, oy = 0;
  for (let i = 0; i < p.length; i++) {
    if (i > 0) { const a = p[i - 1], b = p[i], d = Math.hypot(b[0] - a[0], b[1] - a[1]), n = Math.max(1, Math.round(d / 20)); for (let s = 1; s < n; s++) out.push([a[0] + (b[0] - a[0]) * s / n, a[1] + (b[1] - a[1]) * s / n]); }
    out.push([p[i][0], p[i][1]]);
  }
  return out.map(([x, y]) => { ox = clampS(ox + (botRng() - 0.5) * J * 0.5, -J, J); oy = clampS(oy + (botRng() - 0.5) * J * 0.5, -J, J); return [x + ox, y + oy]; });
}
function botStep(dt) {
  if (!BOT.on || BOT.done) return;
  BOT.wait -= dt; if (BOT.wait > 0) return;
  switch (G.state) {
    case 'title': if (G.loaded) { $('bPlay').click(); BOT.wait = 0.3; } break; // v2: Play lands straight in the lesson
    case 'map': { const n = firstUnsolved(); if (n >= 18) { showEnding(); } else startLesson(n); BOT.wait = 0.3; break; }
    case 'play': {
      if (G.paused) togglePause(false);
      if (G.free) { BOT.done = true; break; }
      const L = G.L, idx = G.strokes.length;
      if (G.stroke) {
        BOT.budget += 2600 * dt; // units per second
        while (BOT.i < BOT.pts.length && BOT.budget >= 20) { const p = BOT.pts[BOT.i++]; moveStroke(p[0], p[1]); BOT.budget -= 20; }
        if (BOT.i >= BOT.pts.length) { endStroke(); BOT.wait = 0.12; }
      } else if (idx < L.strokes.length) {
        const s = L.strokes[idx]; setTool(s.k, true); if (s.c !== undefined) setColour(s.c, true);
        BOT.pts = botPath(s.p); BOT.i = 1; BOT.budget = 0; startStroke(BOT.pts[0][0], BOT.pts[0][1]);
      } else { computeMatch(); layPaper(); BOT.wait = 0.2; }
      break;
    }
    case 'result': {
      const r = G.lastResult; BOT.log.push({ lesson: G.L.index + 1, match: Math.round(r.match * 1000) / 10, strokes: r.strokes, stars: r.stars, seal: !!r.seal, crit: (r.crit || []).map(critText) });
      if (r.solved) { BOT.retries = 0; BOT.lessonsDone++; $('bNext').click(); }
      else if (BOT.retries++ < 2) $('bRetry').click();
      else { BOT.log.push({ lesson: G.L.index + 1, skipped: true }); PROG.stars[G.L.index] = 1; $('bRMap').click(); }
      BOT.wait = 0.3; break;
    }
    case 'ending': BOT.done = true; break;
    default: break;
  }
}

// ---------------------------------------------------------------------------
// Main loop, debug, boot
// ---------------------------------------------------------------------------
const DBG = { fps: 0, calls: 0, tris: 0, frames: 0, acc: 0, gpu: '?', work: 0, workAcc: 0, workMax: 0 };
const dbgEl = $('dbg'); if (FLAG.debug) dbgEl.hidden = false;
try { const gl = renderer.getContext(), ext = gl.getExtension('WEBGL_debug_renderer_info'); DBG.gpu = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : 'unknown'; } catch (e) { DBG.gpu = '?'; }
function placeTool() {
  for (const k in toolMeshes) toolMeshes[k].visible = false;
  if (G.state !== 'play' || G.paused || !G.hover) return;
  const m = toolMeshes[G.tool]; m.visible = true;
  const wx = (G.hover.x / SW - 0.5) * TRAY_W, wz = (G.hover.y / SH - 0.5) * TRAY_H;
  m.position.set(wx, TRAY_Y + (G.pressing ? 0.0 : 0.035), wz);
  if (G.tool === 'tarak') { const [dx, dy] = G.lastDir; m.rotation.y = Math.atan2(-dx, -dy); }
}
function tick(dt) {
  G.time += dt;
  botStep(dt);
  if (G.state === 'laying' && G.lay) stepLay(dt);
  if (G.hint !== null) { G.hintT += dt; G.ovDirty = true; }
  if (G.matchDirty && G.state === 'play' && !G.free && G.time - G.matchAt > 0.25) { G.matchAt = G.time; computeMatch(); updateHud(); }
  if (!G.simming) { stepDust(dt); stepMascot(dt); }
}
function exportState() {
  Object.assign(window.ebru, {
    state: G.state, paused: G.paused, free: G.free, lesson: G.L ? G.L.index + 1 : 0, match: Math.round(G.match * 1000) / 10, strokes: G.strokes.length,
    stars: PROG.stars.slice(), polys: G.sim.polys.length, points: G.sim.points, fps: DBG.fps, work: DBG.work, workMax: Math.round(DBG.workMax * 10) / 10, calls: DBG.calls, tris: DBG.tris, gpu: DBG.gpu,
    bot: { on: BOT.on, done: BOT.done, lessonsDone: BOT.lessonsDone, log: BOT.log }, errors: window.__errs, assets: ASSETS, loaded: G.loaded, zoom: CAM.zoom, portrait: CAM.portrait,
    // v2
    seals: PROG.seals.slice(), sealCount: sealCount(), rank: ['cirak', 'kalfa', 'usta'][rankIndex()], thick: G.thick, hintUsed: G.hintUsed, coach: G.coach,
    crit: G.crit.map(critText), bound: BOUND.slice(), gallery: GALLERY.length, mascot: !!MASCOT.sprite,
  });
}
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now; if (dt > 0.1) dt = 0.1; if (dt <= 0) return;
  if (G.hidden) return; // the tab is hidden: freeze everything
  const w0 = performance.now();
  tick(dt);
  // while a stroke is in progress the paint is re-rasterised at 30 Hz, the room still renders at 60
  if (G.dirtyTex && (!G.stroke || (DBG.frames & 1) === 0)) redrawTray();
  if (G.ovDirty && (DBG.frames & 1) === 1) { drawOverlayNow(); G.ovDirty = false; }
  placeTool();
  renderer.render(scene, camera);
  const w = performance.now() - w0; DBG.workAcc += w; if (w > DBG.workMax) DBG.workMax = w;
  DBG.frames++; DBG.acc += dt;
  if (DBG.acc >= 0.5) {
    DBG.fps = Math.round(DBG.frames / DBG.acc); DBG.work = Math.round(DBG.workAcc / DBG.frames * 100) / 100; DBG.workAcc = 0; DBG.frames = 0; DBG.acc = 0; DBG.calls = renderer.info.render.calls; DBG.tris = renderer.info.render.triangles;
    if (FLAG.debug) dbgEl.innerHTML = `fps ${DBG.fps} · js ${DBG.work} ms (max ${DBG.workMax.toFixed(1)}) · calls ${DBG.calls} · tris ${DBG.tris}\n${G.state}${G.paused ? ' (paused)' : ''} · lesson ${G.L ? G.L.index + 1 : '-'} · match ${Math.round(G.match * 100)}% · strokes ${G.strokes.length}\npolys ${G.sim.polys.length} · points ${G.sim.points} · zoom ${CAM.zoom.toFixed(2)}\n${DBG.gpu}${window.__errs.length ? '\n<span class="err">' + window.__errs.slice(-3).join('\n') + '</span>' : ''}`;
    exportState();
  }
}
window.ebru = {};
window.ebruSim = (seconds) => { // fast-forward without rendering
  G.simming = true; const step = 1 / 30; for (let s = 0; s < seconds; s += step) tick(step);
  G.simming = false; if (G.dirtyTex) redrawTray(); drawOverlayNow(); G.ovDirty = false; exportState(); return window.ebru;
};
window.ebruDebug = { G, LESSONS, PAL, BOT, PROG, buildTarget, matchScore, computeMatch, startStroke, moveStroke, endStroke, layPaper, startLesson, beginPlay, beginFree, setTool, setColour, Marble, StrokeRunner, runStroke, downsample, classStats, paintBase, botPath, TOOL, THICK, redrawTray, paintRT, ovTex, renderer, scene, camera, paintToCanvas,
  critique, critText, bindCover, setThick, setHint, showHint, showCoach, hideCoach, finishSheet, sealCount, rankIndex, openMap, playNext, FACTS: window.EBRU_FACTS, MASCOT };

// boot: texts, icons, hanging sheets from the gallery, then the targets one per task
fillIcons(); $('logoBig').innerHTML = LOGO; $('logoEnd').innerHTML = LOGO; document.querySelector('.logo-s').innerHTML = LOGO;
applyTexts(); refreshTitle(); updateSoundIcon();
GALLERY.slice(-3).forEach((src, i) => { const img = new Image(); img.onload = () => setHangingTexture(i, img); img.src = src; });
G.hangSlot = Math.min(3, GALLERY.length) % 3;
renderer.setSize(innerWidth, innerHeight); fitCamera(); redrawTray(); drawOverlayNow();
dustGeo.setDrawRange(0, SET.quality === 'low' ? Math.floor(DUST_N / 2) : DUST_N);
requestAnimationFrame(frame);
let loadIdx = 0;
function loadStep() {
  try { buildTarget(LESSONS[loadIdx]); } catch (e) { window.__errs.push('target ' + loadIdx + ': ' + e.message); }
  loadIdx++; $('loadmsg').textContent = (SET.lang === 'tr' ? 'Yükleniyor… ' : 'Loading… ') + loadIdx + '/18';
  if (loadIdx < LESSONS.length) setTimeout(loadStep, 0);
  else {
    G.loaded = true; window.__loaded = true; $('loadmsg').hidden = true; $('bPlay').disabled = false; $('bPlay').focus(); exportState();
    loadMascot();
    if (FLAG.free) beginFree(); else if (FLAG.lesson >= 1 && FLAG.lesson <= 18) startLesson(FLAG.lesson - 1);
    if (FLAG.sim > 0) window.ebruSim(FLAG.sim);
  }
}
setTimeout(loadStep, 0);
