<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#120D0A">
<title>Sayfa bulunamadı · Ebru</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #120D0A; color: #F2D8A7; font-family: 'Segoe UI', system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font-family: Georgia, serif; font-weight: 400; font-size: clamp(28px, 7vw, 44px); margin: 0 0 8px; }
  p { margin: 0 0 20px; color: #C9B89A; line-height: 1.5; }
  a { display: inline-block; margin: 6px; padding: 13px 22px; min-height: 44px; box-sizing: border-box; border-radius: 8px; background: #E8912D; color: #18100A; font-weight: 700; text-decoration: none; }
  a.alt { background: transparent; color: #F2D8A7; border: 1px solid rgba(232, 145, 45, .5); }
  a:focus-visible { outline: 3px solid #F5A642; outline-offset: 2px; }
</style>
</head>
<body>
  <main>
    <h1>Bu sayfa teknede yok</h1>
    <p>Aradığın adres bulunamadı. Oyuna ya da diğer oyunlara dönebilirsin.</p>
    <a href="https://furkiozknn.github.io/ebru/">Ebru oyununa dön</a>
    <a class="alt" href="https://furkiozknn.github.io/">Diğer oyunlar</a>
  </main>
</body>
</html>
